name: Build Piscis IPTV Pro APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'firetv-pro/**'
      - '.github/workflows/firetv-pro-apk.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build Piscis IPTV Pro APK
        run: gradle --no-daemon -p firetv-pro assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Piscis-IPTV-Pro-FireTV-APK
          path: firetv-pro/app/build/outputs/apk/debug/app-debug.apk
