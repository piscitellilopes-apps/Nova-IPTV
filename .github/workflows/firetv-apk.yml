name: Build Fire TV APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'firetv/**'
      - '.github/workflows/firetv-apk.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Use preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build Fire TV APK
        run: gradle --no-daemon -p firetv assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: IPTV-FireTV-v29-APK
          path: firetv/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish direct APK for Fire TV Downloader
        run: |
          mkdir -p downloads
          cp firetv/app/build/outputs/apk/debug/app-debug.apk downloads/iptv-firetv-v29.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads/iptv-firetv-v29.apk
          if ! git diff --cached --quiet; then
            git commit -m "Publish Fire TV v29 APK [skip ci]"
            git push origin HEAD:main
          fi
