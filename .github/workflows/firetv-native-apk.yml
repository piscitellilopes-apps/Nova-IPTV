name: Build Native IPTV Fire TV APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'firetv-native/**'
      - '.github/workflows/firetv-native-apk.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build native APK
        run: gradle --no-daemon -p firetv-native assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Piscis-IPTV-Native-FireTV
          path: firetv-native/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish direct APK
        run: |
          mkdir -p downloads
          cp firetv-native/app/build/outputs/apk/debug/app-debug.apk downloads/piscis-native-firetv.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads/piscis-native-firetv.apk
          if ! git diff --cached --quiet; then
            git commit -m "Publish native Fire TV APK [skip ci]"
            git push origin HEAD:main
          fi
